name: 库存探测与补货推送

on:
  # 定时任务：每 5 分钟自动执行一次库存检测
  schedule:
    - cron: '*/5 * * * *'
  # 支持在 GitHub 网页上手动点击按钮触发
  workflow_dispatch:

# 授予写入权限以允许更新 products.json
permissions:
  contents: write

concurrency:
  group: "monitor"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.MY_PAT }}

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行库存探测与变动比对
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -u scripts/checker.py

      - name: 智能提交库存变动数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 获取上一次 Commit 时间戳，计算已过去的天数
          LAST_COMMIT_DATE=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))

          HAS_CHANGE=false
          if [ -f ".has_stock_change" ]; then
            HAS_CHANGE=true
            rm -f .has_stock_change
          fi

          if [ "$HAS_CHANGE" = "true" ]; then
            echo "[*] 检测到套餐库存状态变动，提交数据到 Git 仓库..."
            git add products.json
            git commit -m "chore(stock): 自动同步最新库存变动 [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main || true
              git push origin main && break || {
                echo "[-] Push 发生冲突，重试 ($i/3)..."
                sleep 2
              }
            done
          elif [ "$DAYS_DIFF" -ge 14 ]; then
            echo "[*] 距离上次提交已满 $DAYS_DIFF 天，执行一次真人 PAT 心跳 Commit 维持定时任务活跃..."
            git add products.json
            git commit -m "chore(keepalive): 定期活跃心跳保持 [skip ci]" --allow-empty
            for i in {1..3}; do
              git pull --rebase origin main || true
              git push origin main && break || {
                echo "[-] Push 发生冲突，重试 ($i/3)..."
                sleep 2
              }
            done
          else
            echo "[✓] 库存状态无变动（距上次提交 $DAYS_DIFF 天），静默退出。"
          fi
